[package]
name = "win-iphone-dcim"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
authors = ["Date Huang"]
description = "Read-only iPhone DCIM backup for Windows. Copies photos and videos over WPD and keeps the folder structure that File Explorer shows."
repository = "https://github.com/tjjh89017/win-iphone-dcim"
readme = "README.md"
keywords = ["iphone", "wpd", "backup", "windows", "dcim"]
categories = ["command-line-utilities"]

[[bin]]
name = "win-iphone-dcim"
path = "src/main.rs"

[[bin]]
name = "win-iphone-dcim-gui"
path = "src/bin/gui.rs"

[[test]]
name = "e2e"
required-features = ["fake-device"]

[features]
default = []
# In-memory fake device for the end-to-end tests. Release builds leave it off.
fake-device = []

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6", features = ["derive"] }
indicatif = "0.18.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# Read-only GUI config file next to the exe.
toml = { version = "1.1", default-features = false, features = ["display", "parse", "serde", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[target.'cfg(windows)'.dependencies]
# GUI toolkit. The glow (OpenGL) renderer keeps the ARM64 build simple.
# "links" opens hyperlinks (Help > About) in the default browser.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "links"] }
# Table with resizable columns for the file list.
egui_extras = { version = "0.36.2", default-features = false }
rfd = "0.17.2"
# `#[implement]` of the windows crate expands to paths in windows-core.
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Devices_PortableDevices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_Marshal",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27"
