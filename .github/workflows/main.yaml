# CI workflow.
#
# Checks format and clippy, runs the unit tests, then builds the Windows x64
# and ARM64 release binaries and uploads them as artifacts. Steps live in
# `.github/actions/*`.
#
# Every job runs on windows-latest: the binary uses Windows Portable Devices.
# Lint and test run on x86_64-pc-windows-msvc. The build job also
# cross-compiles aarch64-pc-windows-msvc with the MSVC toolchain on the runner. Tests that need WPD or a real iPhone are
# manual and do not run here.
#
# The lint, test, and build jobs run in parallel. Build runs even when lint or
# test fails, so the artifact always uploads.

name: main

# The push trigger names main only: a tag push must not re-run CI, because
# release.yaml expects the tagged commit to have passed this chain on main.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      - name: Lint
        uses: ./.github/actions/lint

  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Test
        uses: ./.github/actions/test

  build:
    name: Build (${{ matrix.artifact }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact: win-iphone-dcim-windows-x64
          - target: aarch64-pc-windows-msvc
            artifact: win-iphone-dcim-windows-arm64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}

      - name: Build
        id: build
        uses: ./.github/actions/build
        with:
          target: ${{ matrix.target }}

      - name: Upload the release binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.build.outputs.exe }}
          retention-days: 7
          if-no-files-found: error
