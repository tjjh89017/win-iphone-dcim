# CI workflow.
#
# Checks format and clippy, runs the unit tests, then builds the Windows x64
# and ARM64 release binaries (CLI and GUI) and uploads them as artifacts, one
# artifact per target with both files. Steps live in
# `.github/actions/*`.
#
# Every job runs on windows-latest: the binary uses Windows Portable Devices.
# Lint and test run on x86_64-pc-windows-msvc. The build job also
# cross-compiles aarch64-pc-windows-msvc with the MSVC toolchain on the runner. Tests that need WPD or a real iPhone are
# manual and do not run here.
#
# The lint and test jobs run first, in parallel. The build job runs after both
# pass.

name: main

# The push trigger names main only: a tag push must not re-run CI, because
# release.yaml expects the tagged commit to have passed this chain on main.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      - name: Lint
        uses: ./.github/actions/lint

  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Test
        uses: ./.github/actions/test

  build:
    name: Build (${{ matrix.artifact }})
    needs:
      - lint
      - test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact: win-iphone-dcim-windows-x64
          - target: aarch64-pc-windows-msvc
            artifact: win-iphone-dcim-windows-arm64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}

      - name: Build
        id: build
        uses: ./.github/actions/build
        with:
          target: ${{ matrix.target }}

      - name: Upload the release binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ steps.build.outputs.exe }}
            ${{ steps.build.outputs.gui-exe }}
          retention-days: 7
          if-no-files-found: error

  # One stable check the ruleset can require in place of every Build (<artifact>) cell.
  build-required:
    name: Build
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every build target succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "build job result: ${BUILD_RESULT}" >&2
            exit 1
          fi
