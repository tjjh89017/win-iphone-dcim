# Release workflow.
#
# Triggered by a pushed "v*" tag. The build job builds the Windows x64 and
# ARM64 release binaries (CLI and GUI) on windows-latest and zips them with
# their real file names, LICENSE and README.md into
# win-iphone-dcim-windows-<x64|arm64>.zip. The GUI starts
# win-iphone-dcim.exe from its own folder, so the names must not change.
# The publish job then writes one SHA256SUMS.txt over the zips and attaches
# the zips and the checksum file to one draft GitHub release. One job creates the release, so the matrix cells
# cannot race to create two drafts. Steps live in `.github/actions/*`.
#
# No lint/test job here: the tagged commit is expected to have already
# passed main.yaml on main, so re-running it on the tag would only repeat
# work already done.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact: win-iphone-dcim-windows-x64
          - target: aarch64-pc-windows-msvc
            artifact: win-iphone-dcim-windows-arm64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}

      - name: Build
        id: build
        uses: ./.github/actions/build
        with:
          target: ${{ matrix.target }}

      - name: Zip the binaries
        shell: pwsh
        env:
          EXE: ${{ steps.build.outputs.exe }}
          GUI_EXE: ${{ steps.build.outputs.gui-exe }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $files = @($env:EXE, $env:GUI_EXE, 'LICENSE', 'README.md')
          Compress-Archive -Path $files -DestinationPath "dist/$env:ARTIFACT.zip" -CompressionLevel Optimal
          Get-Item "dist/$env:ARTIFACT.zip" | Format-List Name, Length

      - name: Upload the release files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write the combined checksum file
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
          prerelease: >-
            ${{
              contains(github.ref_name, 'RC') ||
              contains(github.ref_name, 'rc')
            }}
