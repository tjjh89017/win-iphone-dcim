# Release workflow.
#
# Triggered by a pushed "v*" tag. It builds the Windows x64 and ARM64 release
# binaries on windows-latest and attaches them, with a SHA256SUMS.txt file per
# target, to one draft GitHub release. Steps live in
# `.github/actions/*`.
#
# No lint/test job here: the tagged commit is expected to have already
# passed main.yaml on main, so re-running it on the tag would only repeat
# work already done.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release (${{ matrix.artifact }})
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact: win-iphone-dcim-windows-x64
          - target: aarch64-pc-windows-msvc
            artifact: win-iphone-dcim-windows-arm64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}

      - name: Build
        id: build
        uses: ./.github/actions/build
        with:
          target: ${{ matrix.target }}

      - name: Rename the binary and write the checksum
        shell: pwsh
        env:
          EXE: ${{ steps.build.outputs.exe }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $name = "$env:ARTIFACT.exe"
          Copy-Item -Path $env:EXE -Destination "dist/$name"
          $hash = (Get-FileHash -Algorithm SHA256 -Path "dist/$name").Hash.ToLower()
          "$hash  $name" | Out-File -FilePath "dist/SHA256SUMS-$env:ARTIFACT.txt" -Encoding ascii

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS-*.txt
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
          prerelease: >-
            ${{
              contains(github.ref_name, 'RC') ||
              contains(github.ref_name, 'rc')
            }}
