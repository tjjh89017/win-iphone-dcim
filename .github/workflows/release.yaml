# Release workflow.
#
# Triggered by a pushed "v*" tag. The build job builds the Windows x64 and
# ARM64 release binaries on windows-latest and writes a SHA256SUMS-<artifact>.txt
# file per target. The publish job then writes one SHA256SUMS.txt for both
# binaries and attaches all files to one draft GitHub release. One job
# creates the release, so the matrix cells cannot race to create two drafts.
# Steps live in `.github/actions/*`.
#
# No lint/test job here: the tagged commit is expected to have already
# passed main.yaml on main, so re-running it on the tag would only repeat
# work already done.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact: win-iphone-dcim-windows-x64
          - target: aarch64-pc-windows-msvc
            artifact: win-iphone-dcim-windows-arm64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}

      - name: Build
        id: build
        uses: ./.github/actions/build
        with:
          target: ${{ matrix.target }}

      - name: Rename the binary and write the checksum
        shell: pwsh
        env:
          EXE: ${{ steps.build.outputs.exe }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $name = "$env:ARTIFACT.exe"
          Copy-Item -Path $env:EXE -Destination "dist/$name"
          $hash = (Get-FileHash -Algorithm SHA256 -Path "dist/$name").Hash.ToLower()
          "$hash  $name" | Out-File -FilePath "dist/SHA256SUMS-$env:ARTIFACT.txt" -Encoding ascii

      - name: Upload the release files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write the combined checksum file
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS*.txt
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
          prerelease: >-
            ${{
              contains(github.ref_name, 'RC') ||
              contains(github.ref_name, 'rc')
            }}
