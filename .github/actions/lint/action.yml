name: 'Lint'
description: 'Check formatting with rustfmt and run clippy with warnings denied, with and without the fake-device feature.'

runs:
  using: 'composite'
  steps:
    - name: Check formatting
      shell: pwsh
      run: cargo fmt --all -- --check

    - name: Run clippy
      shell: pwsh
      run: cargo clippy --all-targets -- -D warnings

    - name: Run clippy with the fake-device feature
      shell: pwsh
      run: cargo clippy --all-targets --features fake-device -- -D warnings
