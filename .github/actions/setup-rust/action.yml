name: 'Set Up Rust'
description: 'Install the stable Rust toolchain and enable the cargo build cache.'

inputs:
  components:
    description: 'Comma-separated rustup components to install, for example rustfmt, clippy'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@v2
