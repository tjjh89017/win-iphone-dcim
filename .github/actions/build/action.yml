name: 'Build'
description: 'Build the Windows release binaries (CLI and GUI) for one target into target/<target>/release.'

inputs:
  target:
    description: 'Rust target triple, for example x86_64-pc-windows-msvc or aarch64-pc-windows-msvc'
    required: true

outputs:
  exe:
    description: 'Path of the built CLI release binary'
    value: ${{ steps.build.outputs.exe }}
  gui-exe:
    description: 'Path of the built GUI release binary'
    value: ${{ steps.build.outputs.gui-exe }}

runs:
  using: 'composite'
  steps:
    - name: Build the release binaries
      id: build
      shell: pwsh
      env:
        TARGET: ${{ inputs.target }}
      run: |
        cargo build --release --locked --target $env:TARGET
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "exe=target/$env:TARGET/release/win-iphone-dcim.exe" >> $env:GITHUB_OUTPUT
        "gui-exe=target/$env:TARGET/release/win-iphone-dcim-gui.exe" >> $env:GITHUB_OUTPUT
